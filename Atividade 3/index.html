<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
    <script src="script.js" defer></script>
</head>
<body>

    <h2>Exercício 1</h2>
    <label for="cotacao">Digite a cotação atual do dolar:</label>
    <input 
        type="number"
        id="cotacao"
        name="cotacao"
        step="0.01"
        min="0"
        placeholder="Ex: 5.42">

    <button id="btnCotacao">Calcular</button>

    <p id="acre1">Acréscimo de 1%:</p>
    <p id="acre2">Acréscimo de 2%:</p>
    <p id="acre5">Acréscimo de 5%:</p>
    <p id="acre10">Acréscimo de 10%:</p>

    <br><br><br><br><br>

    <h2>Exercício 2</h2>
    <label for="omelete">Quantas pessoas irão comer omelete?</label>
    <input 
        type="number"  
        id="omelete"
        name="omelete"
        min="0"
        placeholder="Ex: 1">

    <button id="btnOmelete">Exibir quantidade de ingredientes</button>

    <p id="ovos"></p>
    <p id="queijo"></p>

    <br><br><br><br><br>

    <h2>Exercício 3</h2>
    <label for="valor1">Digite o valor 1:</label>
    <input 
        type="number"
        id="valor1"
        name="valor1"
        placeholder="Ex: 68.23">

    <br><br>

    <label for="valor2">Digite o valor 2:</label>
    <input 
        type="number"
        id="valor2"
        name="valor2"
        placeholder="Ex: 952.10">

    <br><br>

    <button id="btnOperacoes">Calcular</button>

    <p id="soma"></p>
    <p id="subtracao"></p>
    <p id="multiplicacao"></p>
    <p id="divisao"></p>

    <br><br><br><br><br>

    <h2>Exercício 4</h2>
    <p>Digite os sabores de pizza desejados (um em cada campo):</p>
    <input 
        type="text"
        id="sabor1"
        name="sabor1"
        placeholder="Calabresa">
    <input 
        type="text"
        id="sabor2"
        name="sabor2"
        placeholder="Strogonoff">

    <br><br>

    <input 
        type="text"
        id="sabor3"
        name="sabor3"
        placeholder="Moda da Casa">
    <input 
        type="text"
        id="sabor4"
        name="sabor4"
        placeholder="Bacon">

    <br><br>

    <label for="qtdRefri">Digite a quantidade de refrigerantes:</label>
    <input 
        type="number"
        id="qtdRefri"
        name="qtdRefri"
        min="0"
        placeholder="Ex: 2">

    <br><br>

    <button id="btnPedido">Concluir pedido</button>

    <p id="sabores"></p>
    <p id="refris"></p>
    <p id="valorTotal"></p>

    <br><br><br><br><br>

    <h2>Exercício 5</h2>

    <p>Pessoa 1</p>
    <label for="nome1">Nome:</label>
    <input 
        type="text"
        id="nome1"
        name="nome1"
        placeholder="Jorge">
    <label for="ano1">Ano de Nascimento:</label>
    <input 
        type="number"
        id="ano1"
        name="ano1"
        min="0"
        placeholder="1992">

    <p>Pessoa 2</p>
    <label for="nome2">Nome:</label>
    <input 
        type="text"
        id="nome2"
        name="nome2"
        placeholder="Paulo">
    <label for="ano2">Ano de Nascimento:</label>
    <input 
        type="number"
        id="ano2"
        name="ano2"
        min="0"
        placeholder="2002">

    <p>Pessoa 3</p>
    <label for="nome3">Nome:</label>
    <input 
        type="text"
        id="nome3"
        name="nome3"
        placeholder="Cleber">
    <label for="ano3">Ano de Nascimento:</label>
    <input 
        type="number"
        id="ano3"
        name="ano3"
        min="0"
        placeholder="1982">

    <br><br>

    <button id="btnLista">Exibir lista decrescente de idade</button>

    <ul id="listaIdade"></ul>

    <br><br><br><br><br>

    <h2>Exercício 6</h2>

    <label for="nota">Digite a sua nota final:</label>
    <input 
        type="number"
        id="nota"
        name="nota"
        min="0"
        max="10"
        placeholder="8.5">
    <button id="btnResult">Exibir resultado</button>
    <p id="resultNota"></p>

    
</body>
</html>
